#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt (coolsnowwolf/lede) with GitHub Actions
#
# 编排原则（与 P3TERX 模板 / ophub 等仓库对比后的取舍，详见 UPGRADE.md）：
#   1. 配置分成 config/base.config + config/packages.txt，由 scripts/gen-config.sh 拼成 .config
#      —— 日常只改 packages.txt，不用碰 Kconfig 语法
#   2. 编译前先做「包存在性预检」（5 秒），把「绿勾但插件没进固件」提前到编译前暴露
#   3. ccache 缓存（key 绑上游 commit），第二次起只重编改动部分
#   4. 所有 action 锁大版本；删除旧运行/旧 release 改用 gh API，不再依赖两个已停更的第三方 action
#   5. 运行参数（源码/分支/临时加包/是否发 release）走 workflow_dispatch 输入，改配置不必改文件
#

name: OpenWrt Builder

on:
  repository_dispatch:
    types: [Source Code Update]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "源码仓库（留空 = 下面 env.DEFAULT_REPO）"
        required: false
        default: ""
      source_branch:
        description: "源码分支或 tag（留空 = env.DEFAULT_BRANCH；填 tag 可锁版本）"
        required: false
        default: ""
      extra_packages:
        description: "本次临时追加的包，空格分隔（如 luci-app-ttyd；! 前缀表示关闭）"
        required: false
        default: ""
      lan_ip:
        description: "路由器管理地址（留空 = 192.168.0.2）"
        required: false
        default: ""
      hostname:
        description: "主机名（留空 = MyRouter）"
        required: false
        default: ""
      rootfs_mb:
        description: "根分区大小 MB（覆盖 config/base.config 的 2048）"
        type: choice
        required: false
        default: "2048"
        options:
          - "1024"
          - "2048"
          - "3072"
          - "4096"
      preset_openclash:
        description: "预置 OpenClash 内核 + GeoIP/GeoSite（选了 openclash 才有意义）"
        type: boolean
        default: true
      release:
        description: "构建成功后发布 Release"
        type: boolean
        default: false
      use_ccache:
        description: "使用 ccache 缓存（第二次构建起明显变快）"
        type: boolean
        default: true
      debug_ssh:
        description: "失败时开 tmate SSH 进运行环境排查"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# 编译很贵：同一分支只保留最新一次，避免排队跑两遍
concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ===== 默认源码：只改这两行；update-checker.yml 里要保持一致 =====
  DEFAULT_REPO: https://github.com/coolsnowwolf/lede
  DEFAULT_BRANCH: master

  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

  # 上传固件目录（bin/targets/*/*）。想连 bin 一起传就再加一步，不建议（几百 MB）
  UPLOAD_FIRMWARE: true

  # true = 有包找不到 / 被 defconfig 丢弃时直接让构建失败（默认只黄字警告）
  STRICT: "false"
  # 保留最近几次运行 / 几个 release，其余连 artifact 一起清掉
  KEEP_RUNS: "3"
  KEEP_RELEASES: "3"
  ARTIFACT_RETENTION: "14"

  CCACHE_DIR: /workdir/openwrt/.ccache
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    # ubuntu-22.04 自 2026-09-17 进入弃用期（2027-04-17 下线）。
    # 想提前迁到 ubuntu-24.04 / 26.04，只改这一行：
    # 下面的初始化步骤会自动跳过新系统里不存在的 apt 包，不用改包列表。
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # ---------------------------------------------------------------- 参数
    - name: Resolve parameters
      env:
        IN_REPO: ${{ inputs.source_repo }}
        IN_BRANCH: ${{ inputs.source_branch }}
        IN_EXTRA: ${{ inputs.extra_packages }}
        IN_LAN_IP: ${{ inputs.lan_ip }}
        IN_HOSTNAME: ${{ inputs.hostname }}
        IN_ROOTFS: ${{ inputs.rootfs_mb }}
        IN_PRESET_OC: ${{ inputs.preset_openclash }}
        IN_RELEASE: ${{ inputs.release }}
        IN_CCACHE: ${{ inputs.use_ccache }}
        IN_DEBUG: ${{ inputs.debug_ssh }}
      run: |
        set -euo pipefail
        repo="${IN_REPO:-$DEFAULT_REPO}"
        branch="${IN_BRANCH:-$DEFAULT_BRANCH}"
        rel="${IN_RELEASE:-false}"
        cac="${IN_CCACHE:-true}"
        dbg="${IN_DEBUG:-false}"
        {
          echo "REPO_URL=$repo"
          echo "REPO_BRANCH=$branch"
          echo "EXTRA_PACKAGES=$IN_EXTRA"
          echo "UPLOAD_RELEASE=$rel"
          echo "USE_CCACHE=$cac"
          echo "DEBUG_SSH=$dbg"
          echo "ROOTFS_MB=$IN_ROOTFS"
          echo "PRESET_OPENCLASH=${IN_PRESET_OC:-true}"
        } >> "$GITHUB_ENV"

        # 空的输入不写进环境变量，diy-part2.sh 里的默认值才会生效
        [ -n "$IN_LAN_IP" ] && echo "LAN_IP=$IN_LAN_IP" >> "$GITHUB_ENV" || true
        [ -n "$IN_HOSTNAME" ] && echo "ROUTER_HOSTNAME=$IN_HOSTNAME" >> "$GITHUB_ENV" || true

        {
          echo "### 本次构建参数"
          echo ""
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| 源码 | \`$repo\` @ \`$branch\` |"
          echo "| 临时加包 | \`${IN_EXTRA:-（无）}\` |"
          echo "| 管理地址 | \`${IN_LAN_IP:-（默认 192.168.0.2）}\` |"
          echo "| 主机名 | \`${IN_HOSTNAME:-（默认 MyRouter）}\` |"
          echo "| 根分区 | \`${IN_ROOTFS} MB\` |"
          echo "| 预置 OpenClash 内核 | ${IN_PRESET_OC:-true} |"
          echo "| ccache | $cac |"
          echo "| 发 Release | $rel |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        echo "REPO=$repo  BRANCH=$branch  ROOTFS=$IN_ROOTFS  CCACHE=$cac  RELEASE=$rel"

    # ---------------------------------------------------------------- 环境
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -uo pipefail
        # 释放磁盘：镜像预装的 SDK 对 OpenWrt 编译毫无用处
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        sudo -E apt-get -qq update

        # 新版 runner（24.04 / 26.04）里有些老包已不存在（libncurses5-dev、python2.7 …），
        # 这里先探测再装 —— 以后换 runner 版本不用改这份列表。
        PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 \
        ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf \
        python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
        subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev"
        INSTALL=""
        SKIP=""
        for p in $PKGS; do
          if apt-cache show "$p" >/dev/null 2>&1; then INSTALL="$INSTALL $p"; else SKIP="$SKIP $p"; fi
        done
        apt-cache show libncurses5-dev >/dev/null 2>&1 || INSTALL="$INSTALL libncurses-dev"
        if [ -n "$SKIP" ]; then echo "::notice::当前运行器没有这些包，已自动跳过：$SKIP"; fi
        # shellcheck disable=SC2086
        sudo -E apt-get -qq install $INSTALL
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        df -hT /

    # ---------------------------------------------------------------- 源码
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        # --depth 1：只要最新快照，clone 时间从 ~20s 降到 ~5s。
        # 若发现固件里的版本号/描述显示异常，去掉 --depth 1 即可。
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        echo "UPSTREAM_SHA=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Restore ccache
      id: ccache
      if: env.USE_CCACHE == 'true'
      uses: actions/cache/restore@v6
      with:
        # 注意：lede 的 rules.mk 里是无条件 `export CCACHE_DIR=$(TOPDIR)/.ccache`
        # （见 include 里的 CCACHE 段），环境变量会被它覆盖 —— 所以缓存必须放在
        # openwrt/.ccache，放在 /workdir/.ccache 会「缓存永远是空的」。
        # 上面的 env.CCACHE_DIR 与之保持一致，只是为了 `ccache -s` 能读到同一份统计。
        path: /workdir/openwrt/.ccache
        # key 绑上游 commit：源码没变就复用同一份缓存，变了也能靠 restore-keys 命中旧对象
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-${{ env.UPSTREAM_SHA }}-
          ccache-${{ env.REPO_BRANCH }}-

    # ---------------------------------------------------------------- feeds
    - name: Load custom feeds
      run: |
        set -euo pipefail
        if [ -e "$FEEDS_CONF" ]; then cp -f "$FEEDS_CONF" openwrt/feeds.conf.default; fi
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH" "$GITHUB_WORKSPACE/scripts/"*.sh
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ---------------------------------------------------------------- 配置
    - name: Load custom configuration
      run: |
        set -euo pipefail
        if [ -d files ]; then mv files openwrt/files; fi
        # Windows 上 checkout 出来的可执行位不可靠：uci-defaults 里的脚本必须带 +x，
        # 否则只会被当普通文件拷进固件、首次启动不执行（防火墙加速的默认值就丢了）
        if [ -d openwrt/files/etc/uci-defaults ]; then
          find openwrt/files/etc/uci-defaults -type f -exec chmod +x {} \;
        fi

        # 由 config/ 下的分层文件生成 openwrt/.config
        ./scripts/gen-config.sh openwrt

        # 机型无关的「改源码」动作（默认 LAN IP / 主机名…）
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # luci-app-openclash 本身不含内核，也没带 GeoIP/GeoSite；不预置的话
    # 刷完机能打开页面但启动不了，还得手动点「下载内核」
    - name: Preset OpenClash core
      if: env.PRESET_OPENCLASH == 'true'
      run: |
        OPENWRT_DIR=openwrt REQ_FILE=/tmp/requested.list \
          EXTRA_PACKAGES="$EXTRA_PACKAGES" ./scripts/preset-openclash.sh

    - name: Pre-check requested packages
      run: |
        OPENWRT_DIR=openwrt STRICT="$STRICT" ./scripts/check-packages.sh pre

    # ---------------------------------------------------------------- 编译
    - name: Resolve .config (make defconfig) and reconcile
      id: defconfig
      run: |
        set -o pipefail
        cd openwrt
        cp .config /tmp/requested.config
        make defconfig 2>&1 | tee /tmp/defconfig.log
        {
          echo ""
          echo "### make defconfig 警告"
          echo ""
          echo '```'
          grep -Ei 'warning|warn.*invalid|error' /tmp/defconfig.log | head -n 30 || echo "(无)"
          echo '```'
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" || true
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Reconcile requested vs effective options
      run: |
        OPENWRT_DIR=openwrt STRICT="$STRICT" ./scripts/check-packages.sh post

    - name: Show effective key options
      run: |
        cd openwrt
        {
          echo ""
          echo "### 最终生效的关键项"
          echo ""
          echo '```'
          grep -E '^CONFIG_TARGET_|^CONFIG_PACKAGE_(luci-app|adguardhome|openclash|tailscale|kmod-virtio)' .config \
            | head -n 40 || true
          echo '```'
          echo ""
          echo "> lede 的 DEFAULT_PACKAGES.router 自带一批 luci 应用，它们不在你的 packages.txt 里，"
          echo "> 但会真的编进固件 —— 想确认「真正装进镜像的包」，看最后的对账报告。"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" || true

    - name: Download packages
      run: |
        cd openwrt
        # 上游 mirror 偶发抖动：失败就退回单线程再试一次
        make download -j8 || make download -j1 || echo "::warning::下载仍有失败项，继续编译（编译期会再取）"
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile the firmware
      id: compile
      run: |
        set -o pipefail
        cd openwrt
        echo "=== $(nproc) 线程编译 ==="
        if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
          echo "并行编译成功"
        else
          echo "::warning::并行编译失败，改用 -j1 V=s 重编，以定位第一个出错的文件"
          make -j1 V=s 2>&1 | tee -a /tmp/build.log
        fi

        ccache -s 2>/dev/null || true
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"; fi
        echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

    # ccache 到底有没有生效，只能看这里：命中率 0% 或体积 0 说明缓存没接上
    - name: Report ccache stats
      if: env.USE_CCACHE == 'true'
      run: |
        {
          echo ""
          echo "### ccache"
          echo ""
          echo "- 目录 \`$CCACHE_DIR\`，体积 $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(未生成)')"
          echo ""
          echo '```'
          ccache -s 2>/dev/null || echo "(ccache 未安装，本次没有缓存)"
          echo '```'
          echo ""
          echo "> lede 的 rules.mk 会强制 \`export CCACHE_DIR=$(TOPDIR)/.ccache\`，"
          echo "> 所以缓存目录只能是 \`openwrt/.ccache\`，写别处会「看起来配了、实际全量编译」。"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" || true

    # 缓存到底有没有生效，变成一条可公开查询的 annotation：
    # Actions 日志要登录才能看，::warning:: / ::notice:: 不用登录也能拿到。
    - name: Check ccache is really used
      id: ccachecheck
      if: env.USE_CCACHE == 'true' && !cancelled()
      run: |
        cd openwrt
        cfg="$(grep -E '^CONFIG_CCACHE=' .config || echo '(没有 CONFIG_CCACHE 这一行)')"
        size="$(du -sh .ccache 2>/dev/null | cut -f1 || true)"
        have=no
        if [ -d .ccache ] && [ -n "$(ls -A .ccache 2>/dev/null)" ]; then have=yes; fi
        echo "have=$have" >> "$GITHUB_OUTPUT"
        {
          echo ""
          echo "### ccache 自检"
          echo ""
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| \`.config\` | \`$cfg\` |"
          echo "| 目录大小 | ${size:-（目录不存在）} |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" || true
        if ! grep -q '^CONFIG_CCACHE=y' .config; then
          echo "::warning::.config 里没有 CONFIG_CCACHE=y（$cfg），ccache 没参与编译：检查 config/base.config"
        elif [ "$have" = "no" ]; then
          echo "::warning::CONFIG_CCACHE=y 但 openwrt/.ccache 是空的，没有可保存的缓存（下次还是全量编译）"
        else
          echo "::notice::ccache 生效：目录 $size，本次结束后存成缓存"
        fi

    - name: Save ccache
      if: always() && env.USE_CCACHE == 'true' && steps.ccachecheck.outputs.have == 'yes'
      uses: actions/cache/save@v6
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}

    # ---------------------------------------------------------------- 报告
    - name: Report images and really-installed packages
      if: (!cancelled())
      run: |
        cd openwrt
        {
          echo ""
          echo "### 镜像产物"
          echo ""
          echo '```'
          find bin/targets -maxdepth 3 -type f \( -name '*.img*' -o -name '*.bin' -o -name '*.itb' \) \
            -printf '%f\t%s\n' 2>/dev/null | sort || true
          echo '```'
          echo ""
          echo "### 对账：请求的包有没有真正装进固件"
          echo ""
          echo "（依据 bin/targets 下的包清单；bin/packages 只是编译产物，不代表被安装）"
          echo ""
          echo '```'
          awk -F= '$2=="y"{print $1}' /tmp/requested.list 2>/dev/null | while read -r p; do
            case "$p" in kmod-*) continue ;; esac
            if find bin/targets -type f \( -name "${p}_*" -o -name "${p}-*" \) 2>/dev/null | grep -q .; then
              echo "OK   $p"
            else
              echo "MISS $p"
            fi
          done
          echo '```'
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" || true

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ---------------------------------------------------------------- 产物
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: ${{ env.ARTIFACT_RETENTION }}
        # 产物本身已经是 .img.gz，再 zip 压缩纯属浪费 1~2 分钟 CPU
        compression-level: 0
        if-no-files-found: error

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: build-logs${{ env.FILE_DATE }}
        path: |
          openwrt/.config
          openwrt/logs/
          /tmp/build.log
          /tmp/defconfig.log
        if-no-files-found: ignore
        retention-days: 5

    - name: Diagnose failure
      if: failure()
      run: |
        {
          echo ""
          echo "### 失败定位（自动摘录）"
          echo ""
          if [ -f /tmp/build.log ]; then
            echo "- 编译日志：$(du -h /tmp/build.log | cut -f1)"
            echo ""
            echo "**最后的报错行：**"
            echo ""
            echo '```'
            grep -nE 'Error [0-9]+|error:|fatal error|ld: ' /tmp/build.log | tail -n 15 || echo "(没抓到明显报错行)"
            echo '```'
            echo ""
            echo "**最后涉及的包目录（多半就是它编不过）：**"
            echo ""
            echo '```'
            grep -oE 'package/(feeds/[a-z0-9_-]+/)?[A-Za-z0-9._+-]+' /tmp/build.log | tail -n 5 || true
            echo '```'
            echo ""
            echo "> 处理办法：多数是上游某个包本身编不过。把它的名字写进 \`config/packages.txt\` 并加 \`!\` 前缀"
            echo "> （或先在 \`diy-part1.sh\` 去掉对应 feed），能立刻出一版可用的固件。"
          else
            echo "没有 /tmp/build.log，说明失败在编译之前的步骤，看上面第一个红叉的日志。"
          fi
        } >> "$GITHUB_STEP_SUMMARY" || true

    - name: Debug via SSH (tmate)
      if: failure() && env.DEBUG_SSH == 'true'
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30

    # ---------------------------------------------------------------- Release
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        set -euo pipefail
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        {
          echo "OpenWrt 云编译 · $REPO_URL @ \`$REPO_BRANCH\`"
          echo ""
          echo "- 上游 commit: \`$UPSTREAM_SHA\`"
          echo "- 机型: x86_64 generic（详见 config/base.config）"
          echo "- 构建时间: $(TZ=$TZ date +"%Y-%m-%d %H:%M")"
          echo ""
          echo "### 刷完机怎么进后台"
          echo ""
          echo "- 地址: <http://${LAN_IP:-192.168.0.2}>"
          echo "- 用户名 \`root\`，密码为空（进去第一件事改成自己的密码）"
          echo "- SSH 与网页终端已对所有网口开放"
          echo "- 加速已在「网络 → 防火墙 → 常规设置」默认开启：全锥形 NAT、软件流量卸载、TCP=BBR"
          echo ""
          echo "### 插件清单（config/packages.txt）"
          echo '```'
          cat config/packages.txt | grep -vE '^[[:space:]]*(#|$)' || true
          echo '```'
          echo ""
          echo "### 镜像"
          echo '```'
          ls -lh "$FIRMWARE" | awk '{print $5"\t"$9}' || true
          echo '```'
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # ---------------------------------------------------------------- 清理
    - name: Clean old releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "sort_by(.created_at) | reverse | .[$KEEP_RELEASES:][] | .id" 2>/dev/null || true)
        for id in $ids; do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1 || true
        done
        echo "已保留最新 $KEEP_RELEASES 个 release"

    - name: Clean old workflow runs
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        wf="${GITHUB_WORKFLOW_REF##*/}"
        wf="${wf%@*}"
        ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100&status=completed" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | sort_by(.created_at) | reverse | .[$KEEP_RUNS:][] | .id" \
              2>/dev/null || true)
        for id in $ids; do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
        done
        echo "已保留最近 $KEEP_RUNS 次运行（含其 artifact）"
